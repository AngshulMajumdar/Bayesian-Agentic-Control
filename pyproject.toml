[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bayesian-rag"
version = "1.7.0"
description = "Bayesian and probabilistic orchestration for tool-augmented language model agents"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Angshul Majumdar", email = "angshul@iiitd.ac.in"}]
license = {text = "MIT"}
keywords = ["bayesian", "sequential-monte-carlo", "llm-agents", "rag", "orchestration"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
api = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "pydantic>=2.7,<3.0",
]
dev = [
  "bayesian-rag[api]",
  "pytest>=8.0,<9.0",
  "httpx>=0.27,<1.0",
]

[project.urls]
Homepage = "https://github.com/AngshulMajumdar/BayesianRAG"
Repository = "https://github.com/AngshulMajumdar/BayesianRAG"

[project.scripts]
bayesian-rag-bench = "bayesian_rag.benchmark:main"

[tool.setuptools.packages.find]
include = ["bayesian_rag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
